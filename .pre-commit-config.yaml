# Run `pre-commit install` to activate all hooks (commit, commit-msg, and pre-push
# hook types are installed automatically via default_install_hook_types).
default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.106.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_docs
        args:
          - '--args=--lockfile=false'
      - id: terraform_tflint

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: end-of-file-fixer
        exclude: ^(CLAUDE\.md|AGENTS\.md)$
      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - chore
          - refactor
          - test
          - ci
          - perf
          - build
          - revert

  - repo: local
    hooks:
      - id: protect-default-branches
        name: Block direct push to main/master
        entry: scripts/hooks/pre-push-protect-branches.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false
