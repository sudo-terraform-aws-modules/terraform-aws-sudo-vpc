compact: true
quiet: true
framework:
  - terraform

# Examples are demonstration configs - not production hardened.
# Strict security checks run only on the module root.
skip-path:
  - examples/

# Each skip links the issue that owns the fix. Remove the skip in the PR that fixes it.
# Reference: https://www.checkov.io/5.Policy%20Index/terraform.html
skip-check:
  # False positive: with default inputs the default SG is managed with no ingress or egress
  # rules, so it restricts all traffic.
  - CKV2_AWS_12
